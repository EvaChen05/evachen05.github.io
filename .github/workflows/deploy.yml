name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 强制所有 Action 使用 Node.js 24 运行环境以消除弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned Maid Cafe commit
        id: maid-cafe
        run: echo "sha=$(git rev-parse HEAD:apps/maid-cafe)" >> "$GITHUB_OUTPUT"

      - name: Check Maid Cafe repository access
        env:
          MAID_CAFE_READ_TOKEN: ${{ secrets.MAID_CAFE_READ_TOKEN }}
        run: |
          if [ -z "$MAID_CAFE_READ_TOKEN" ]; then
            echo "::error::Add the MAID_CAFE_READ_TOKEN Actions secret with read access to EvaChen05/maid_cafe."
            exit 1
          fi

      - name: Checkout Maid Cafe
        uses: actions/checkout@v4
        with:
          repository: EvaChen05/maid_cafe
          ref: ${{ steps.maid-cafe.outputs.sha }}
          path: apps/maid-cafe
          token: ${{ secrets.MAID_CAFE_READ_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            apps/maid-cafe/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Install Maid Cafe dependencies
        run: npm ci
        working-directory: apps/maid-cafe

      - name: Build Astro
        run: npm run build
        working-directory: frontend

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
